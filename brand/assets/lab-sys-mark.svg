<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">lab.sys square mark</title>
  <desc id="desc">Square lab.sys mark for avatars and compact use.</desc>
  <defs>
    <style>
      .bg { fill: #07080A; }
      .mark { fill: none; stroke: #F4F1E8; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .word { font-family: "IBM Plex Mono", "JetBrains Mono", "Space Mono", "Roboto Mono", "Courier New", monospace; font-size: 60px; font-weight: 500; letter-spacing: 0; }
      .neutral { fill: #F4F1E8; }
      .system { fill: #1777E6; }

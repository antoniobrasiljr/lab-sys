<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Controlador da constelação</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      button {
        width: 100%; height: 100%; padding: 0 16px; border: 1px solid rgba(7, 8, 10, .5);
        background: rgba(255, 255, 255, .25); color: #07080a; cursor: pointer;
        font: 500 9px/1.2 Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase;
        transition: background-color .2s ease, color .2s ease;
      }
      button:hover, button:focus-visible { background: #07080a; color: #f1ede4; outline: none; }
    </style>
  </head>
  <body>
    <button type="button">reorganizar constelação ↻</button>
    <script>
      (() => {
        const host = window.parent;

        function initialize() {
          const constellation = host.document.querySelector(".constellation");

          if (!constellation || constellation.dataset.constellationReady) return;

          if (!constellation.querySelector(".people-grid--constellation")) return;

          constellation.dataset.constellationReady = "true";

          function reorganize() {
            const grid = host.document.querySelector(".people-grid--constellation");
            if (!grid) return;

            constellation.dataset.shuffleCount = String(
              Number(constellation.dataset.shuffleCount || "0") + 1,
            );

            const cards = Array.from(grid.children);

            for (let index = cards.length - 1; index > 0; index -= 1) {
              const randomIndex = Math.floor(Math.random() * (index + 1));
              [cards[index], cards[randomIndex]] = [cards[randomIndex], cards[index]];
            }

            if (cards.every((card, index) => card === grid.children[index])) {
              cards.push(cards.shift());
            }

            cards.forEach((card) => grid.appendChild(card));
          }

          document.querySelector("button").addEventListener("click", reorganize);
        }

        if (host.document.readyState === "loading") {
          host.addEventListener("DOMContentLoaded", initialize, { once: true });
        } else {
          initialize();
        }
      })();
    </script>
  </body>
</html>
